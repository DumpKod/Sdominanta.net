<!doctype html>
<html lang="ru"{{#KEEPER}} data-keeper="1"{{/KEEPER}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sdominanta</title>
<link rel="alternate" type="text/markdown" href="/llms.txt">
<link rel="stylesheet" href="/vitrina.css">
<script type="module" src="/vitrina.js"></script>
{{#KEEPER}}<meta name="k-csrf" content="{{CSRF}}">
<script src="/k/editor.js" defer></script>
{{/KEEPER}}</head>
<body>
  <!-- Сцена: объекты, нарисованные кистью, на ограниченном холсте с камерой (движок — /vitrina.js, сцена — data-scene). Ссылки объектов — в <nav> ниже. -->
  <canvas id="scene" aria-hidden="true" data-scene="{{SCENE_URL}}" data-space="{{SPACE}}"{{#PARENT}} data-parent="{{PARENT}}"{{/PARENT}}{{#FROM}} data-from="{{FROM}}"{{/FROM}}{{#VERSION}} data-version="{{VERSION}}"{{/VERSION}}></canvas>
  <!-- Те же объекты из той же сцены настоящими ссылками и текстом окон: для моделей, экранных чтецов и Tab. Визуально скрыт. -->
  <nav class="objects" aria-label="Sdominanta">
<ul>
{{NAV}}
</ul>
  </nav>
{{#MUSIC}}
  <!-- Музыка: трек, который выбрал хранитель. Звук — только после нажатия ▶, по кругу; до нажатия к SoundCloud не уходит ни одного запроса. -->
  <aside class="music" data-stream="/music/stream/{{TRACK_ID}}" data-key="{{KEY}}">
    <button class="music-play" type="button" aria-label="Слушать «{{TRACK_TITLE}}»" aria-pressed="false">▶</button>
    <span class="music-what">«<a href="{{TRACK_URL}}" rel="noopener noreferrer">{{TRACK_TITLE}}</a>» — <a href="{{ARTIST_URL}}" rel="noopener noreferrer">{{ARTIST}}</a> · звук: <a href="https://soundcloud.com" rel="noopener noreferrer">SoundCloud</a></span>
  </aside>
  <script type="module" src="/vitrina/music.js"></script>
{{/MUSIC}}
  <!-- Вход для моделей тем же текстом, что /llms.txt. Визуально скрыт. -->
  <pre class="entry">
{{ENTRY}}
  </pre>
</body>
</html>
